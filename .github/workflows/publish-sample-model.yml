name: Publish Sample Model Component

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Push sample OCM component to GHCR
    runs-on: ubuntu-latest
    env:
      TARGET: ghcr.io/${{ github.repository_owner }}/model-server/models
      COMPONENT: example.org/tiny-model
      COMPONENT_VERSION: "1.0.0"
      OCM_VERSION: "0.42.0"

    steps:
      - uses: actions/checkout@v4

      - name: Install OCM CLI
        run: |
          curl -fsSL \
            "https://github.com/open-component-model/ocm/releases/download/v${OCM_VERSION}/ocm-${OCM_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin ocm
          ocm version

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build CTF archive
        working-directory: examples/component
        run: |
          ocm add componentversions \
            --create \
            --file ./transport-archive \
            component-constructor.yaml

      - name: Verify CTF
        working-directory: examples/component
        run: ocm get componentversions ctf::./transport-archive

      - name: Push component to GHCR
        working-directory: examples/component
        run: |
          ocm transfer componentversions \
            "ctf::./transport-archive//${COMPONENT}:${COMPONENT_VERSION}" \
            "$TARGET" \
            --copy-resources

      - name: Verify remote
        run: |
          ocm get componentversions "${{ env.TARGET }}//${{ env.COMPONENT }}:${{ env.COMPONENT_VERSION }}"
          echo "Sample component published at ${{ env.TARGET }}"
