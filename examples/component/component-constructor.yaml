components:
  - name: example.org/tiny-model
    version: 1.0.0
    provider:
      name: example-org
    labels:
      - name: ext.ocm.software/model-server.model-id
        value: "example-org/tiny-model"
      - name: ext.ocm.software/model-server.task
        value: "text-generation"
      - name: ext.ocm.software/model-server.library
        value: "transformers"
      - name: ext.ocm.software/model-server.family
        value: "tiny-gpt"
      - name: ext.ocm.software/model-server.license
        value: "cc0-1.0"
    resources:
      - name: weights
        type: modelWeights
        relation: local
        input:
          type: file
          path: tiny-model/weights.bin
          mediaType: application/octet-stream
        labels:
          - name: ext.ocm.software/model-server.filename
            value: "weights.bin"
          - name: ext.ocm.software/model-server.format
            value: "bin"

      - name: config
        type: modelConfig
        relation: local
        input:
          type: file
          path: tiny-model/config.json
          mediaType: application/json
        labels:
          - name: ext.ocm.software/model-server.filename
            value: "config.json"

      - name: tokenizer
        type: tokenizer
        relation: local
        input:
          type: file
          path: tiny-model/tokenizer.json
          mediaType: application/json
        labels:
          - name: ext.ocm.software/model-server.filename
            value: "tokenizer.json"

      - name: model-card
        type: modelCard
        relation: local
        input:
          type: file
          path: tiny-model/README.md
          mediaType: text/markdown
        labels:
          - name: ext.ocm.software/model-server.filename
            value: "README.md"
