  <text x="58" y="508" font-size="9" fill="#48cae4">  labels: ai.../filename, ai.../format, ai.../lfs</text>
  <rect x="48" y="516" width="333" height="40" rx="1" fill="#0a2040" stroke="#112240" stroke-width="1"/>
  <text x="58" y="532" font-size="10" fill="#ffffff">tokenizer</text>
  <text x="130" y="532" font-size="10" fill="#48cae4">tokenizer</text>
  <text x="260" y="532" font-size="10" fill="#90e0ef">tokenizer.json</text>
  <text x="58" y="548" font-size="9" fill="#90e0ef">  relation: local   access: LocalBlob   format: json</text>
  <text x="58" y="558" font-size="9" fill="#48cae4">  labels: ai.../filename, ai.../format, ai.../lfs</text>
  <rect x="48" y="566" width="333" height="40" rx="1" fill="#0a2040" stroke="#112240" stroke-width="1"/>
