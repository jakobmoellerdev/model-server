  <polyline points="395,500 412,500" fill="none" stroke="#00b4d8" stroke-width="1.5" marker-end="url(#arr)"/>
  <polyline points="547,500 555,500 555,530 570,530" fill="none" stroke="#00b4d8" stroke-width="1.5" marker-end="url(#arr)"/>
