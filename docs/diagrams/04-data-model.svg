  <text x="50" y="234" font-size="10" fill="#ffffff">ai.modelserver.io/model-id</text>
  <text x="290" y="234" font-size="10" fill="#06d6a0">REQUIRED</text>
  <text x="50" y="250" font-size="10" fill="#90e0ef">  → "meta-llama/Llama-3-8B"</text>
  <text x="50" y="268" font-size="10" fill="#ffffff">ai.modelserver.io/task</text>
  <text x="290" y="268" font-size="10" fill="#06d6a0">REQUIRED</text>
  <text x="50" y="284" font-size="10" fill="#90e0ef">  → "text-generation"</text>
  <text x="50" y="302" font-size="10" fill="#90e0ef">ai.modelserver.io/library   → "transformers"</text>
  <text x="50" y="318" font-size="10" fill="#90e0ef">ai.modelserver.io/license   → "apache-2.0"</text>
  <text x="50" y="334" font-size="10" fill="#90e0ef">ai.modelserver.io/family    → "llama"</text>
  <text x="50" y="350" font-size="10" fill="#90e0ef">ai.modelserver.io/gated     → false</text>
  <text x="50" y="366" font-size="10" fill="#90e0ef">ai.modelserver.io/private   → false</text>
