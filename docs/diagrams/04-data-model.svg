  <text x="30" y="72" font-size="10" fill="#48cae4" letter-spacing="1">OCM COMPONENT (stored in OCI registry)</text>
  <rect x="35" y="83" width="360" height="90" rx="2" fill="#0d1f3c" stroke="#48cae4" stroke-width="1"/>
  <text x="215" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">descriptor.Descriptor</text>
  <text x="215" y="122" text-anchor="middle" font-size="10" fill="#90e0ef">name:     github.com/org/model-name</text>
  <text x="215" y="138" text-anchor="middle" font-size="10" fill="#90e0ef">version:  1.0.0</text>
  <text x="215" y="154" text-anchor="middle" font-size="10" fill="#90e0ef">provider: {name: "org"}</text>
  <text x="215" y="166" text-anchor="middle" font-size="10" fill="#48cae4">signatures: []  ← Signed=true if present</text>
  <rect x="35" y="190" width="360" height="180" rx="2" fill="#0d1f3c" stroke="#f77f00" stroke-width="1"/>
  <text x="215" y="210" text-anchor="middle" font-size="11" font-weight="700" fill="#f77f00">Component Labels  (ai.modelserver.io/*)</text>
