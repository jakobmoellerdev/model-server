  <text x="260" y="582" font-size="10" fill="#90e0ef">README.md</text>
  <text x="58" y="598" font-size="9" fill="#90e0ef">  relation: local   access: LocalBlob   format: markdown</text>
  <text x="58" y="608" font-size="9" fill="#48cae4">  labels: ai.../filename, ai.../format, ai.../lfs</text>
  <rect x="412" y="210" width="135" height="40" rx="2" fill="#0a2040" stroke="#06d6a0" stroke-width="1"/>
  <text x="480" y="226" text-anchor="middle" font-size="10" font-weight="700" fill="#06d6a0">ExtractInfo(cv)</text>
  <text x="480" y="242" text-anchor="middle" font-size="9" fill="#90e0ef">ocm/descriptor.go</text>
  <polyline points="395,230 412,230" fill="none" stroke="#06d6a0" stroke-width="1.5" marker-end="url(#arr-grn)"/>
  <polyline points="547,230 555,230 555,247 570,247" fill="none" stroke="#06d6a0" stroke-width="1.5" marker-end="url(#arr-grn)"/>
  <rect x="412" y="480" width="135" height="40" rx="2" fill="#0a2040" stroke="#00b4d8" stroke-width="1"/>
  <text x="480" y="496" text-anchor="middle" font-size="10" font-weight="700" fill="#00b4d8">mapFiles(cv)</text>
