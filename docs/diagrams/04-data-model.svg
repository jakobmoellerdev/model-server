  <text x="560" y="72" font-size="10" fill="#06d6a0" letter-spacing="1">MODEL-SERVER TYPES  (internal/registry/types.go)</text>
  <rect x="565" y="83" width="360" height="350" rx="2" fill="#0d1f3c" stroke="#06d6a0" stroke-width="1"/>
  <text x="745" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">ModelDescriptor</text>
