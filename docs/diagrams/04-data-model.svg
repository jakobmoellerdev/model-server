  <text x="660" y="128" font-size="10" fill="#48cae4">string</text>
  <text x="790" y="128" font-size="9" fill="#90e0ef">// meta-llama/Llama-3-8B</text>
  <text x="578" y="148" font-size="10" fill="#90e0ef">Component</text>
  <text x="660" y="148" font-size="10" fill="#48cae4">string</text>
  <text x="790" y="148" font-size="9" fill="#90e0ef">// github.com/org/model</text>
  <text x="578" y="168" font-size="10" fill="#90e0ef">Version</text>
  <text x="660" y="168" font-size="10" fill="#48cae4">string</text>
  <text x="790" y="168" font-size="9" fill="#90e0ef">// 1.0.0</text>
  <text x="578" y="188" font-size="10" fill="#90e0ef">Task</text>
  <text x="660" y="188" font-size="10" fill="#48cae4">string</text>
  <text x="790" y="188" font-size="9" fill="#90e0ef">// text-generation</text>
  <text x="578" y="208" font-size="10" fill="#90e0ef">Library</text>
  <text x="660" y="208" font-size="10" fill="#48cae4">string</text>
  <text x="790" y="208" font-size="9" fill="#90e0ef">// transformers</text>
  <text x="578" y="228" font-size="10" fill="#90e0ef">Family</text>
  <text x="660" y="228" font-size="10" fill="#48cae4">string</text>
  <text x="790" y="228" font-size="9" fill="#90e0ef">// llama</text>
  <text x="578" y="248" font-size="10" fill="#90e0ef">License</text>
  <text x="660" y="248" font-size="10" fill="#48cae4">string</text>
  <text x="790" y="248" font-size="9" fill="#90e0ef">// apache-2.0</text>
  <text x="578" y="268" font-size="10" fill="#90e0ef">Gated</text>
  <text x="660" y="268" font-size="10" fill="#48cae4">bool</text>
  <text x="790" y="268" font-size="9" fill="#90e0ef">// false</text>
  <text x="578" y="288" font-size="10" fill="#90e0ef">Private</text>
  <text x="660" y="288" font-size="10" fill="#48cae4">bool</text>
  <text x="790" y="288" font-size="9" fill="#90e0ef">// false</text>
  <text x="578" y="308" font-size="10" fill="#f77f00">Signed</text>
  <text x="660" y="308" font-size="10" fill="#48cae4">bool</text>
  <text x="790" y="308" font-size="9" fill="#90e0ef">// true if signatures>0</text>
  <text x="578" y="328" font-size="10" fill="#90e0ef">Labels</text>
  <text x="660" y="328" font-size="10" fill="#48cae4">map[string]string</text>
  <text x="790" y="328" font-size="9" fill="#90e0ef">// all labels</text>
  <text x="578" y="348" font-size="10" fill="#00b4d8">Files</text>
  <text x="660" y="348" font-size="10" fill="#48cae4">[]FileEntry</text>
  <text x="790" y="348" font-size="9" fill="#90e0ef">// see below</text>
  <text x="578" y="368" font-size="10" fill="#48cae4">CreatedAt</text>
  <text x="660" y="368" font-size="10" fill="#48cae4">time.Time</text>
  <text x="790" y="368" font-size="9" fill="#90e0ef">// now()</text>
  <text x="578" y="388" font-size="10" fill="#48cae4">Digest</text>
  <text x="660" y="388" font-size="10" fill="#48cae4">string</text>
  <text x="790" y="388" font-size="9" fill="#90e0ef">// name@version</text>
  <rect x="565" y="452" width="360" height="180" rx="2" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1"/>
  <text x="745" y="473" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">FileEntry</text>
  <line x1="565" y1="479" x2="925" y2="479" stroke="#00b4d8" stroke-width="0.5"/>
  <text x="578" y="497" font-size="10" fill="#00b4d8">Path</text>
  <text x="660" y="497" font-size="10" fill="#48cae4">string</text>
  <text x="790" y="497" font-size="9" fill="#90e0ef">// "model.safetensors"</text>
  <text x="578" y="521" font-size="10" fill="#00b4d8">Size</text>
  <text x="660" y="521" font-size="10" fill="#48cae4">int64</text>
  <text x="790" y="521" font-size="9" fill="#90e0ef">// bytes from blob</text>
  <text x="578" y="545" font-size="10" fill="#00b4d8">Digest</text>
  <text x="660" y="545" font-size="10" fill="#48cae4">string</text>
  <text x="790" y="545" font-size="9" fill="#90e0ef">// "sha256:..."</text>
  <text x="578" y="569" font-size="10" fill="#00b4d8">MediaType</text>
  <text x="660" y="569" font-size="10" fill="#48cae4">string</text>
  <text x="790" y="569" font-size="9" fill="#90e0ef">// "application/x-safetensors"</text>
  <text x="578" y="593" font-size="10" fill="#00b4d8">IsLFS</text>
  <text x="660" y="593" font-size="10" fill="#48cae4">bool</text>
  <text x="790" y="593" font-size="9" fill="#90e0ef">// true for weights (large file)</text>
  <polyline points="745,433 745,452" fill="none" stroke="#00b4d8" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="750" y="438" width="58" height="13" rx="1" fill="#0a1628" opacity="0.9"/>
  <text x="779" y="448" text-anchor="middle" font-size="9" fill="#00b4d8">[]FileEntry</text>
  <rect x="630" y="627" width="305" height="56" rx="2" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1"/>
  <line x1="630" y1="643" x2="935" y2="643" stroke="#00b4d8" stroke-width="0.5"/>
  <text x="783" y="639" text-anchor="middle" font-size="9" fill="#caf0f8" letter-spacing="1">DIAGRAM 4 / 4</text>
  <text x="783" y="660" text-anchor="middle" font-size="12" font-weight="700" fill="#00b4d8">DATA MODEL</text>
  <text x="783" y="675" text-anchor="middle" font-size="10" fill="#90e0ef">OCM Component → ModelDescriptor mapping</text>
</svg>