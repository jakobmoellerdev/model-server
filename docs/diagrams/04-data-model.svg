  <text x="58" y="482" font-size="10" fill="#ffffff">config</text>
  <text x="130" y="482" font-size="10" fill="#48cae4">modelConfig</text>
  <text x="260" y="482" font-size="10" fill="#90e0ef">config.json</text>
