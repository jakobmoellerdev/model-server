      <polygon points="0 0, 8 3, 0 6" fill="#f77f00"/>
    </marker>
  </defs>
  <rect width="960" height="700" fill="#0a1628"/>
  <rect width="960" height="700" fill="url(#grid)" opacity="0.6"/>
  <text x="480" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="2">DATA MODEL — OCM Component → ModelDescriptor</text>
