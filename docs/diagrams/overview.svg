<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520">
  <style>
    text { font-family: 'Courier New', 'Lucida Console', monospace; fill: #caf0f8; }
  </style>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#112240" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#00b4d8"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#06d6a0"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" fill="#0d1b2a"/>
  <rect width="960" height="520" fill="url(#grid)" opacity="0.6"/>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff" letter-spacing="0.08em">model-server Architecture</text>

  <!-- ── CLIENTS column ── -->
  <rect x="22" y="60" width="158" height="340" rx="2" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1"/>
  <rect x="22" y="60" width="158" height="26" rx="2" fill="#00b4d8" fill-opacity="0.2"/>
  <line x1="22" y1="86" x2="180" y2="86" stroke="#00b4d8" stroke-width="0.8"/>
  <text x="101" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#00b4d8" letter-spacing="0.08em">CLIENTS</text>

  <!-- HF SDK -->
  <rect x="36" y="96" width="130" height="52" rx="2" fill="#0a2240" stroke="#48cae4" stroke-width="1"/>
  <text x="101" y="115" text-anchor="middle" font-size="12" fill="#caf0f8">HF Python SDK</text>
  <text x="101" y="131" text-anchor="middle" font-size="10" fill="#90e0ef">huggingface_hub</text>
  <text x="101" y="143" text-anchor="middle" font-size="10" fill="#48cae4">transformers</text>

  <!-- Ollama CLI -->
  <rect x="36" y="158" width="130" height="52" rx="2" fill="#0a2240" stroke="#48cae4" stroke-width="1"/>
  <text x="101" y="177" text-anchor="middle" font-size="12" fill="#caf0f8">ollama CLI</text>
  <text x="101" y="193" text-anchor="middle" font-size="10" fill="#90e0ef">OLLAMA_HOST</text>
  <text x="101" y="205" text-anchor="middle" font-size="10" fill="#48cae4">REST client</text>

  <!-- OpenAI SDK -->
  <rect x="36" y="220" width="130" height="52" rx="2" fill="#0a2240" stroke="#48cae4" stroke-width="1"/>
  <text x="101" y="239" text-anchor="middle" font-size="12" fill="#caf0f8">OpenAI SDK</text>
  <text x="101" y="255" text-anchor="middle" font-size="10" fill="#90e0ef">openai.OpenAI(</text>
  <text x="101" y="267" text-anchor="middle" font-size="10" fill="#48cae4">base_url=...)</text>

  <!-- MLflow client -->
  <rect x="36" y="282" width="130" height="52" rx="2" fill="#0a2240" stroke="#48cae4" stroke-width="1"/>
  <text x="101" y="301" text-anchor="middle" font-size="12" fill="#caf0f8">MLflow client</text>
  <text x="101" y="317" text-anchor="middle" font-size="10" fill="#90e0ef">MlflowClient()</text>
  <text x="101" y="329" text-anchor="middle" font-size="10" fill="#48cae4">tracking_uri=...</text>

  <!-- curl -->
  <rect x="36" y="344" width="130" height="40" rx="2" fill="#0a2240" stroke="#48cae4" stroke-width="1"/>
  <text x="101" y="360" text-anchor="middle" font-size="12" fill="#caf0f8">curl / browser</text>
  <text x="101" y="376" text-anchor="middle" font-size="10" fill="#90e0ef">plain HTTP</text>

  <!-- ── MODEL-SERVER box ── -->
  <rect x="200" y="55" width="560" height="360" rx="2" fill="#0d1f3c" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="200" y="55" width="560" height="30" rx="2" fill="#ffffff" fill-opacity="0.12"/>
  <line x1="200" y1="85" x2="760" y2="85" stroke="#ffffff" stroke-width="1"/>
  <text x="480" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="0.1em">model-server</text>

  <!-- API panels — 4 columns, each 130px wide with 6px gap -->
  <!-- HF Hub panel  x=210 -->
  <rect x="210" y="95" width="128" height="240" rx="2" fill="#0a2240" stroke="#00b4d8" stroke-width="1" stroke-dasharray="5,3"/>
  <rect x="210" y="95" width="128" height="22" rx="2" fill="#00b4d8" fill-opacity="0.25"/>
  <line x1="210" y1="117" x2="338" y2="117" stroke="#00b4d8" stroke-width="0.5"/>
  <text x="274" y="111" text-anchor="middle" font-size="10" font-weight="700" fill="#00b4d8" letter-spacing="0.05em">HF HUB API</text>
  <text x="274" y="138" text-anchor="middle" font-size="11" fill="#caf0f8">GET /api/models</text>
  <text x="274" y="158" text-anchor="middle" font-size="11" fill="#caf0f8">GET /api/models/</text>
  <text x="274" y="173" text-anchor="middle" font-size="11" fill="#90e0ef">  {owner}/{model}</text>
  <text x="274" y="196" text-anchor="middle" font-size="11" fill="#caf0f8">GET /…/tree/</text>
  <text x="274" y="211" text-anchor="middle" font-size="11" fill="#90e0ef">  {revision}</text>
  <text x="274" y="234" text-anchor="middle" font-size="11" fill="#caf0f8">GET /…/resolve/</text>
  <text x="274" y="249" text-anchor="middle" font-size="11" fill="#90e0ef">  {rev}/{file}</text>
  <text x="274" y="272" text-anchor="middle" font-size="11" fill="#caf0f8">HEAD /…/resolve/</text>
  <text x="274" y="287" text-anchor="middle" font-size="11" fill="#90e0ef">  {rev}/{file}</text>
  <text x="274" y="310" text-anchor="middle" font-size="11" fill="#caf0f8">GET /…/raw/</text>
  <text x="274" y="325" text-anchor="middle" font-size="11" fill="#90e0ef">  {rev}/{file}</text>

  <!-- Ollama panel  x=344 -->
  <rect x="344" y="95" width="128" height="240" rx="2" fill="#0a2240" stroke="#48cae4" stroke-width="1" stroke-dasharray="5,3"/>
  <rect x="344" y="95" width="128" height="22" rx="2" fill="#48cae4" fill-opacity="0.2"/>
  <line x1="344" y1="117" x2="472" y2="117" stroke="#48cae4" stroke-width="0.5"/>
  <text x="408" y="111" text-anchor="middle" font-size="10" font-weight="700" fill="#48cae4" letter-spacing="0.05em">OLLAMA API</text>
  <text x="408" y="138" text-anchor="middle" font-size="11" fill="#caf0f8">GET /api/tags</text>
  <text x="408" y="162" text-anchor="middle" font-size="11" fill="#caf0f8">POST /api/show</text>
  <text x="408" y="186" text-anchor="middle" font-size="11" fill="#caf0f8">POST /api/pull</text>
  <text x="408" y="208" text-anchor="middle" font-size="10" fill="#90e0ef">↳ NDJSON stream</text>

  <!-- OpenAI panel  x=478 -->
  <rect x="478" y="95" width="128" height="240" rx="2" fill="#0a2240" stroke="#90e0ef" stroke-width="1" stroke-dasharray="5,3"/>
  <rect x="478" y="95" width="128" height="22" rx="2" fill="#90e0ef" fill-opacity="0.15"/>
  <line x1="478" y1="117" x2="606" y2="117" stroke="#90e0ef" stroke-width="0.5"/>
  <text x="542" y="111" text-anchor="middle" font-size="10" font-weight="700" fill="#90e0ef" letter-spacing="0.05em">OPENAI API</text>
  <text x="542" y="138" text-anchor="middle" font-size="11" fill="#caf0f8">GET /v1/models</text>
  <text x="542" y="162" text-anchor="middle" font-size="11" fill="#caf0f8">GET /v1/models/</text>
  <text x="542" y="177" text-anchor="middle" font-size="11" fill="#90e0ef">  {owner}/{model}</text>
  <text x="542" y="201" text-anchor="middle" font-size="11" fill="#caf0f8">GET /v1/models/</text>
  <text x="542" y="216" text-anchor="middle" font-size="11" fill="#90e0ef">  {model}</text>

  <!-- MLflow panel  x=612 -->
  <rect x="612" y="95" width="138" height="240" rx="2" fill="#0a2240" stroke="#06d6a0" stroke-width="1" stroke-dasharray="5,3"/>
  <rect x="612" y="95" width="138" height="22" rx="2" fill="#06d6a0" fill-opacity="0.2"/>
  <line x1="612" y1="117" x2="750" y2="117" stroke="#06d6a0" stroke-width="0.5"/>
  <text x="681" y="111" text-anchor="middle" font-size="10" font-weight="700" fill="#06d6a0" letter-spacing="0.05em">MLFLOW API</text>
  <text x="681" y="133" text-anchor="middle" font-size="10" fill="#caf0f8">GET /api/2.0/mlflow/</text>
  <text x="681" y="150" text-anchor="middle" font-size="10" fill="#90e0ef">registered-models/</text>
  <text x="681" y="164" text-anchor="middle" font-size="10" fill="#90e0ef">  search</text>
  <text x="681" y="181" text-anchor="middle" font-size="10" fill="#90e0ef">  get</text>
  <text x="681" y="200" text-anchor="middle" font-size="10" fill="#caf0f8">model-versions/</text>
  <text x="681" y="214" text-anchor="middle" font-size="10" fill="#90e0ef">  search</text>
  <text x="681" y="228" text-anchor="middle" font-size="10" fill="#90e0ef">  get</text>
  <text x="681" y="242" text-anchor="middle" font-size="10" fill="#90e0ef">  get-download-uri</text>

  <!-- Shared registry layer -->
  <rect x="210" y="348" width="540" height="52" rx="2" fill="#0a2240" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="4,2"/>
  <text x="480" y="368" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.08em">ModelRegistry interface</text>
  <text x="480" y="388" text-anchor="middle" font-size="10" fill="#90e0ef">Search · Describe · ListFiles · OpenFile · Refresh</text>

  <!-- Downward arrows from API panels to registry -->
  <line x1="274" y1="335" x2="274" y2="347" stroke="#00b4d8" stroke-width="1" marker-end="url(#arrow-cyan)"/>
  <line x1="408" y1="335" x2="408" y2="347" stroke="#48cae4" stroke-width="1" marker-end="url(#arrow-cyan)"/>
  <line x1="542" y1="335" x2="542" y2="347" stroke="#90e0ef" stroke-width="1" marker-end="url(#arrow-cyan)"/>
  <line x1="681" y1="335" x2="681" y2="347" stroke="#06d6a0" stroke-width="1" marker-end="url(#arrow-green)"/>

  <!-- Health strip -->
  <line x1="210" y1="412" x2="750" y2="412" stroke="#00b4d8" stroke-width="0.5" stroke-dasharray="4,2"/>
  <text x="330" y="404" text-anchor="middle" font-size="10" fill="#48cae4">/healthz</text>
  <text x="420" y="404" text-anchor="middle" font-size="10" fill="#48cae4">|</text>
  <text x="480" y="404" text-anchor="middle" font-size="10" fill="#48cae4">/readyz</text>
  <text x="540" y="404" text-anchor="middle" font-size="10" fill="#48cae4">|</text>
  <text x="630" y="404" text-anchor="middle" font-size="10" fill="#48cae4">/metrics</text>

  <!-- ── OCM BACKEND column ── -->
  <rect x="780" y="60" width="158" height="260" rx="2" fill="#0d1f3c" stroke="#06d6a0" stroke-width="1"/>
  <rect x="780" y="60" width="158" height="26" rx="2" fill="#06d6a0" fill-opacity="0.2"/>
  <line x1="780" y1="86" x2="938" y2="86" stroke="#06d6a0" stroke-width="0.8"/>
  <text x="859" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#06d6a0" letter-spacing="0.08em">OCM BACKEND</text>

  <rect x="794" y="98" width="130" height="62" rx="2" fill="#0a2240" stroke="#48cae4" stroke-width="1"/>
  <text x="859" y="118" text-anchor="middle" font-size="12" fill="#caf0f8">OCI Registry</text>
  <text x="859" y="135" text-anchor="middle" font-size="10" fill="#90e0ef">GHCR / ECR / ACR</text>
  <text x="859" y="151" text-anchor="middle" font-size="10" fill="#48cae4">signed components</text>

  <rect x="794" y="172" width="130" height="62" rx="2" fill="#0a2240" stroke="#48cae4" stroke-width="1"/>
  <text x="859" y="192" text-anchor="middle" font-size="12" fill="#caf0f8">CTF Archive</text>
  <text x="859" y="209" text-anchor="middle" font-size="10" fill="#90e0ef">local filesystem</text>
  <text x="859" y="225" text-anchor="middle" font-size="10" fill="#48cae4">air-gapped</text>

  <rect x="794" y="246" width="130" height="62" rx="2" fill="#0a2240" stroke="#48cae4" stroke-width="1"/>
  <text x="859" y="266" text-anchor="middle" font-size="12" fill="#caf0f8">Blob Cache</text>
  <text x="859" y="283" text-anchor="middle" font-size="10" fill="#90e0ef">content-addressed</text>
  <text x="859" y="299" text-anchor="middle" font-size="10" fill="#48cae4">local disk</text>

  <!-- Client arrows → model-server -->
  <line x1="181" y1="122" x2="199" y2="200" stroke="#00b4d8" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <line x1="181" y1="184" x2="199" y2="215" stroke="#00b4d8" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <line x1="181" y1="246" x2="199" y2="230" stroke="#00b4d8" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <line x1="181" y1="308" x2="199" y2="245" stroke="#00b4d8" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <line x1="181" y1="364" x2="199" y2="260" stroke="#00b4d8" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <rect x="184" y="218" width="44" height="16" rx="2" fill="#0d1b2a" opacity="0.95"/>
  <text x="206" y="230" text-anchor="middle" font-size="10" fill="#00b4d8">HTTP</text>

  <!-- Registry → OCM backends -->
  <line x1="751" y1="365" x2="779" y2="129" stroke="#06d6a0" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="751" y1="375" x2="779" y2="203" stroke="#06d6a0" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="751" y1="385" x2="779" y2="277" stroke="#06d6a0" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="752" y="352" width="86" height="16" rx="2" fill="#0d1b2a" opacity="0.95"/>
  <text x="795" y="364" text-anchor="middle" font-size="10" fill="#06d6a0">OCM bindings</text>

  <!-- Legend -->
  <rect x="22" y="432" width="270" height="42" rx="2" fill="#0d1f3c" stroke="#00b4d8" stroke-width="0.5" opacity="0.9"/>
  <text x="38" y="448" font-size="10" fill="#00b4d8" letter-spacing="0.06em">LEGEND</text>
  <line x1="38" y1="465" x2="68" y2="465" stroke="#00b4d8" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="74" y="469" font-size="10" fill="#90e0ef">HTTP request</text>
  <line x1="152" y1="465" x2="182" y2="465" stroke="#06d6a0" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="188" y="469" font-size="10" fill="#90e0ef">OCM bindings</text>
</svg>
